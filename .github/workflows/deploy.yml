name: Deploy Hexo Blog

# 워크플로우 실행 조건
on:
  push:
    branches:
      - source # 'source' 브랜치에 푸시될 때 실행됩니다.

jobs:
  build-and-deploy:
    if: |
      startsWith(github.event.head_commit.message, 'Create Post') ||
      startsWith(github.event.head_commit.message, 'Update Post') ||
      startsWith(github.event.head_commit.message, 'Delete Post')
    runs-on: ubuntu-latest # 실행 환경
    permissions:
      contents: write # master 브랜치에 배포(push)하기 위해 쓰기 권한을 부여합니다.

    steps:
      # 1. 소스 코드 체크아웃
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 전체 커밋 기록을 가져오기

      # 2. Node.js 환경 설정
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Hexo 8.x는 Node.js 20 이상이 필요합니다.
          cache: 'npm' # npm 의존성 캐싱

      # 3. Hexo 및 플러그인 설치
      - name: Install Dependencies
        run: npm install

      # 4. Hexo 빌드
      - name: Build
        run: |
          npx hexo clean
          npx hexo generate

      # 5. GitHub Pages에 배포
      - name: Deploy to GitHub Pages
        env:
          # GitHub이 Actions 실행할 때마다 자동으로 발급해주는 임시 토큰
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "jinsugyeong"
          git config --global user.email "apr15th@naver.com"
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          cd public
          git init
          git remote add origin https://github.com/jinsugyeong/jinsugyeong.github.io.git
          git fetch origin master
          git reset --soft origin/master
          git add -A
          git commit -m "Site updated: $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M:%S')" || echo "Nothing to commit"
          git push origin master